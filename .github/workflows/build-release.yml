name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ctranslate2 faster-whisper sounddevice cffi onnxruntime PySide6 pywin32 numpy

      - name: Build Windows Executable
        run: |
          pyinstaller --noconsole --onefile --icon=whisper_icon.ico --name=WhisperVoiceDictation-Windows-x64 --collect-all ctranslate2 --collect-all faster_whisper --collect-all sounddevice --collect-all cffi --collect-all onnxruntime main.py

      - name: Upload Windows Asset to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/WhisperVoiceDictation-Windows-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ctranslate2 faster-whisper sounddevice cffi onnxruntime PySide6 numpy

      - name: Build Linux Binary
        run: |
          pyinstaller --noconsole --onefile --name=WhisperVoiceDictation-Linux-x86_64 --collect-all ctranslate2 --collect-all faster_whisper --collect-all sounddevice --collect-all cffi --collect-all onnxruntime main.py
          cd dist
          tar -czvf WhisperVoiceDictation-Linux-x86_64.tar.gz WhisperVoiceDictation-Linux-x86_64

      - name: Upload Linux Asset to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/WhisperVoiceDictation-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ctranslate2 faster_whisper sounddevice cffi onnxruntime PySide6 numpy

      - name: Build macOS Binary
        run: |
          pyinstaller --noconsole --onefile --name=WhisperVoiceDictation-macOS-Universal --collect-all ctranslate2 --collect-all faster_whisper --collect-all sounddevice --collect-all cffi --collect-all onnxruntime main.py
          cd dist
          zip -r WhisperVoiceDictation-macOS-Universal.zip WhisperVoiceDictation-macOS-Universal

      - name: Upload macOS Asset to Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/WhisperVoiceDictation-macOS-Universal.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
