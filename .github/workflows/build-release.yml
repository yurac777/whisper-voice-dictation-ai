name: Cross-Platform Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Windows Executable
        run: |
          pyinstaller --noconsole --onefile --icon=whisper_icon.ico --name=WhisperVoiceDictation-Windows-x64 --collect-all ctranslate2 --collect-all faster_whisper --collect-all sounddevice --collect-all cffi --collect-all onnxruntime main.py

      - name: Generate Checksum
        shell: pwsh
        run: |
          cd dist
          Get-FileHash WhisperVoiceDictation-Windows-x64.exe -Algorithm SHA256 | Format-List > WhisperVoiceDictation-Windows-x64.sha256.txt

      - name: Upload Windows Asset to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WhisperVoiceDictation-Windows-x64.exe
            dist/WhisperVoiceDictation-Windows-x64.sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

